# ── Helpdesk AI — Pipeline CI ──────────────────────────────────────────────────
# Déclencheurs : push sur main + branches feat/fix/chore + PR vers main
#
# Jobs :
#   python-ci    — lint (ruff) + tests unitaires
#   angular-ci   — build Angular (production)
#   docker-build — vérification du build des images Docker
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main

jobs:

  # ── Python : lint + tests ─────────────────────────────────────────────────────
  python-ci:
    name: "Python — lint + tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helpdesk-ai

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: helpdesk-ai/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt ruff

      - name: Lint — ruff (src/ + api/ + tests/ + scripts/)
        run: ruff check src/ api/ tests/ scripts/ --ignore E501,E402

      - name: Tests unitaires (pytest)
        # Exclut test_api_integration.py : nécessite models/best_pipeline.pkl,
        # ignoré par .gitignore (models/*.pkl) et donc absent du checkout CI.
        run: >
          pytest tests/ --ignore=tests/test_api_integration.py -v --tb=short

  # ── Angular : build de production ────────────────────────────────────────────
  angular-ci:
    name: "Angular — build production"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helpdesk-ai/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: helpdesk-ai/frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Build Angular (production)
        run: npm run build

  # ── Docker : vérification du build des images ─────────────────────────────────
  docker-build:
    name: "Docker — build images"
    runs-on: ubuntu-latest
    needs: [python-ci, angular-ci]
    defaults:
      run:
        working-directory: helpdesk-ai

    steps:
      - uses: actions/checkout@v4

      - name: Build image API
        run: docker build -f docker/Dockerfile.api -t helpdesk-api:ci .

      - name: Build image Frontend
        run: docker build -f docker/Dockerfile.front -t helpdesk-front:ci .
