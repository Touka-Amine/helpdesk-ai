# ── Helpdesk AI — docker-compose multi-services ────────────────────────────────
#
# Usage (depuis helpdesk-ai/) :
#   cp .env.example .env          # puis GENERER les trois secrets marques REMPLACER__
#   docker compose --env-file .env -f docker/docker-compose.yml up --build
#
# L'option --env-file est obligatoire : sans elle, Compose cherche un .env dans le
# repertoire du fichier de composition (docker/) et non a la racine du projet, et
# l'interpolation des identifiants de base echoue avec un message explicite.
#
# Services exposés :
#   http://localhost:8081 → Frontend Angular (Nginx)
#   http://localhost:8000 → API FastAPI (+ /docs pour Swagger)
#   http://localhost:8501 → Dashboard Streamlit
#   (interne)             → PostgreSQL (base opérationnelle) — pas de port hôte exposé
#
# Note : port 80 non utilisé côté hôte — réservé par Windows (plage d'exclusion
# Hyper-V/WSL2 + service système sur PID 4). 8081 choisi pour éviter tout conflit.
#
# GPU (optionnel, machine avec NVIDIA uniquement) : ce fichier reste utilisable tel
# quel sur une machine sans GPU (ex. jour de la soutenance). Pour activer l'accélération
# GPU d'Ollama sur une machine qui en a une, ajouter la surcouche dédiée :
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.gpu.yml up -d --build
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Ollama — LLM local pour la synthèse RAG "human-in-the-loop" (100% on-premise,
  # aucune donnée de ticket ne sort de l'infrastructure) ────────────────────────
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - helpdesk-net

  # ── PostgreSQL — base opérationnelle (utilisateurs, tickets, historique) ──────
  postgres:
    image: postgres:16-alpine
    env_file:
      - ../.env
    environment:
      # Valeurs lues dans ../.env, jamais ecrites en dur : le fichier d'exemple
      # est public et un mot de passe committe serait un mot de passe connu.
      - POSTGRES_USER=${POSTGRES_USER:?definir POSTGRES_USER dans .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD dans .env}
      - POSTGRES_DB=${POSTGRES_DB:?definir POSTGRES_DB dans .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - helpdesk-net

  # ── API FastAPI ──────────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: helpdesk-api:latest
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      # PostgreSQL (service ci-dessus), résolu par nom de service sur le réseau interne
      - DB_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Accepter le frontend ET l'accès direct depuis le navigateur
      - CORS_ORIGINS=http://localhost:8081,http://localhost:4200,http://localhost:8000,http://localhost:4300
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      # Persistance de la base de connaissances vectorielle ChromaDB + modèles
      - api-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - helpdesk-net

  # ── Frontend Angular (Nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.front
    image: helpdesk-front:latest
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - helpdesk-net

  # ── Dashboard Streamlit ──────────────────────────────────────────────────────
# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  api-data:
    driver: local
  postgres-data:
    driver: local
  ollama-data:
    driver: local

# ── Réseau interne ────────────────────────────────────────────────────────────
networks:
  helpdesk-net:
    driver: bridge
