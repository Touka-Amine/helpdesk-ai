# ── Helpdesk AI — docker-compose multi-services ────────────────────────────────
#
# Usage (depuis helpdesk-ai/) :
#   cp .env.example .env          # puis adapter les valeurs
#   docker compose -f docker/docker-compose.yml up --build
#
# Services exposés :
#   http://localhost:8081 → Frontend Angular (Nginx)
#   http://localhost:8000 → API FastAPI (+ /docs pour Swagger)
#   http://localhost:8501 → Dashboard Streamlit
#   (interne)             → PostgreSQL (base opérationnelle) — pas de port hôte exposé
#
# Note : port 80 non utilisé côté hôte — réservé par Windows (plage d'exclusion
# Hyper-V/WSL2 + service système sur PID 4). 8081 choisi pour éviter tout conflit.
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Ollama — LLM local pour la synthèse RAG "human-in-the-loop" (100% on-premise,
  # aucune donnée de ticket ne sort de l'infrastructure) ────────────────────────
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - helpdesk-net

  # ── PostgreSQL — base opérationnelle (utilisateurs, tickets, historique) ──────
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=helpdesk
      - POSTGRES_PASSWORD=helpdesk
      - POSTGRES_DB=helpdesk
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - helpdesk-net

  # ── API FastAPI ──────────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: helpdesk-api:latest
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      # PostgreSQL (service ci-dessus), résolu par nom de service sur le réseau interne
      - DB_URL=postgresql+psycopg2://helpdesk:helpdesk@postgres:5432/helpdesk
      # Accepter le frontend ET l'accès direct depuis le navigateur
      - CORS_ORIGINS=http://localhost:8081,http://localhost:4200,http://localhost:8000
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      # Persistance de la base de connaissances vectorielle ChromaDB + modèles
      - api-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - helpdesk-net

  # ── Frontend Angular (Nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.front
    image: helpdesk-front:latest
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - helpdesk-net

  # ── Dashboard Streamlit ──────────────────────────────────────────────────────
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    image: helpdesk-dashboard:latest
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - helpdesk-net

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  api-data:
    driver: local
  postgres-data:
    driver: local
  ollama-data:
    driver: local

# ── Réseau interne ────────────────────────────────────────────────────────────
networks:
  helpdesk-net:
    driver: bridge
