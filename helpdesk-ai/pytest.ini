[pytest]
testpaths = tests
python_files = test_*.py

markers =
    slow: test qui charge un modele lourd (sentence-transformers, FAISS) ou fait
        tourner ChromaDB. Exclure avec  pytest -m "not slow"  pour une execution
        rapide pendant le developpement.

# Les avertissements de depreciation viennent des dependances (faiss, swig,
# mlflow), pas du code du projet. Les afficher a chaque execution noierait les
# messages utiles.
filterwarnings =
    ignore::DeprecationWarning
