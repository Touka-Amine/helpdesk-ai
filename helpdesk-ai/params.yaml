data:
  raw_path: data/raw/HelpDesk1.csv
  processed_path: data/processed/HelpDesk1.csv
  train_path: data/splits/train.csv
  test_path: data/splits/test.csv
  rag_path: data/splits/rag.csv
  test_size: 0.2
  random_state: 42

split:
  # "group"            : GroupShuffleSplit par Titre (comportement historique)
  # "stratified_group" : groupes par Titre, repartis pour que les 8 categories
  #                      soient presentes au test. Change la reference d'evaluation.
  strategy: group
  # Jeu de test GELE. Une fois cree, split.py le relit au lieu de le regenerer :
  # sans reference stable, comparer deux modeles n'a aucun sens (cf. promote.py).
  freeze_test: true
  reference_test_path: data/reference/test_reference.csv
  reference_manifest: data/reference/test_reference_manifest.json

nlp:
  max_features: 5000
  ngram_range: [1, 2]
  min_df: 2

rag:
  top_k: 3
  # Seuil de récupération, recalibré sur l'échelle du score hybride.
  #
  # L'ancienne valeur, 0.50, était héritée de l'échelle du cosinus pur et se
  # trouvait HORS DE PORTÉE du score hybride : sur les 40 requêtes annotées, le
  # meilleur score par requête va de 0.3366 à 0.4886 et n'atteint jamais 0.50.
  # Le seuil ne filtrait donc rien — il se contentait de marquer « repli » 100 %
  # des recommandations, pour une sortie identique à celle d'un seuil de 0.20.
  #
  # 0.35 est le point mesuré où la précision de ce qui est réellement affiché est
  # la plus haute (0.5185 contre 0.3667 sans filtre effectif), et où le taux de
  # repli — 15 % — redevient un signal au lieu d'une constante.
  # Contrepartie assumée : 2.02 suggestions par requête au lieu de 3.00.
  #
  # RÉSERVE, et elle doit accompagner le chiffre partout où il est cité : ce
  # seuil a été CHOISI sur les 40 requêtes qui servent ensuite à le juger. Un
  # réglage choisi et mesuré sur les mêmes données est flatteur. Validé de façon
  # croisée — seuil choisi sur 32 requêtes, mesuré sur les 8 réservées, cinq
  # plis — la précision tombe à 0.4886 contre 0.5652 dans l'échantillon, soit
  # +0.0766 d'optimisme, environ un septième. (Ce 0.4886 est, par coïncidence,
  # le même nombre que le plafond du score ci-dessus ; les deux n'ont aucun
  # rapport.) Le CHOIX, lui, est stable : 0.35 ou 0.38 selon le pli.
  # 0.5185 doit donc se lire comme un ordre de grandeur majoré.
  #
  # Mesures : src/pipeline/rag_eval.py --balayage-seuil et
  # scripts/seuil_rag_hors_echantillon.py, protocole annoté (40 requêtes).
  similarity_threshold: 0.35
  fallback_threshold: 0.20     # plancher : en deçà, aucune suggestion n'est rendue
  # Pondération du sémantique dans le score hybride. Mesuré au seuil servi :
  # relever alpha rapproche l'échelle hybride de l'échelle sémantique et fait
  # tomber le repli, au prix de la précision de l'affiché (alpha=0.8 → 0.3613
  # contre 0.5185 ici ; la précision@3 reste plate, de 0.3500 à 0.3667).
  # 0.5 reste le meilleur réglage ; le défaut venait du seuil, pas de la fusion.
  hybrid_alpha: 0.5

ml:
  confidence_threshold: 0.60   # relevé de 0.40 → routage auto ~70% tickets à ~85% précision
  confidence_threshold_v1: 0.40 # ancienne valeur — conservée pour référence benchmark

augment:
  cible_par_categorie: 0    # 0 = aligner sur la categorie la plus fournie
  max_par_source: 5         # plafond de paraphrases par ticket d'origine
  temperature: 0.9

# ─────────────────────────────────────────────────────────────────────────────
# AXE 1 — Boucle d'amelioration du modele de classification
# ─────────────────────────────────────────────────────────────────────────────

collect:
  curated_dir: data/curated
  # Un ticket n'est eligible que s'il a ete reellement traite par un humain.
  eligible_statuts: ["Résolu"]
  require_approved_by: true
  min_description_words: 5
  # Force du label, deduite de ticket_history :
  #   corrected → un admin a change categorie_finale        (label fort)
  #   confirmed → categorie_finale journalisee, non modifiee (label moyen)
  #   weak      → l'admin n'a jamais touche a la categorie   (confirmation par omission)
  # Inclure les "weak" revient largement a reentrainer le modele sur ses propres
  # sorties : la boucle amplifierait ses erreurs au lieu de les corriger.
  include_weak_labels: false
  label_weights:
    corrected: 1.0
    confirmed: 0.7
    weak: 0.3

retrain:
  # Declencheurs evalues par src/monitoring/ml_monitor.py. Le moniteur ECRIT UN
  # RAPPORT, il ne lance rien : la decision reste humaine (dvc repro).
  min_new_tickets: 150        # sous ce seuil, reparti sur 8 classes, l'apport
                              # par classe reste sous le bruit d'echantillonnage
                              # du jeu de test (356 lignes)
  min_new_per_minority: 30    # +30 sur Sécurité (73 tickets) = +40 %, detectable
  minority_categories: ["Sécurité", "Backup", "Communication"]
  disagreement_increase_pts: 10.0   # hausse du desaccord ML/humain vs reference
  min_days_between_retrains: 7      # verrou anti "ML continu naif"

promotion:
  # Un modele candidat ne remplace la production que s'il passe TOUTES ces portes,
  # evaluees sur le jeu de test GELE (data/reference/test_reference.csv).
  primary_metric: f1_macro_heuristiques
  min_improvement: 0.005       # gain minimum sur la metrique principale
  max_class_regression: 0.05   # aucune classe ne doit perdre plus que ca
  allow_accuracy_regression: false
  # Les classes sans support au test sont exclues des comparaisons : leur F1 vaut
  # 0.0 par construction et ecraserait la moyenne dans les deux sens.
  ignore_zero_support_classes: true

registry:
  dir: models/registry
  production_alias: production
  # MLflow : le Model Registry fonctionne avec le store "file:./mlruns" mais MLflow
  # 3.6 le declare deprecie. Le registre de reference du projet reste celui de
  # src/registry/model_registry.py ; l'enregistrement MLflow est un complement dont
  # l'echec n'est jamais bloquant.
  mlflow_register: auto        # auto | true | false

# ─────────────────────────────────────────────────────────────────────────────
# AXE 2 — Cycle de vie des connaissances (RAG)
# ─────────────────────────────────────────────────────────────────────────────

knowledge:
  snapshot_dir: data/knowledge
  eval_set_path: data/knowledge/rag_eval_set.json
  quality:
    min_solution_words: 4
    # Une suggestion IA jamais relue par un humain ne doit pas devenir une
    # connaissance de reference : sinon le RAG se nourrit de ses propres sorties.
    require_human_solution: true
    # Rejette une "solution" qui n'est qu'un copier-coller de la description.
    max_overlap_with_description: 0.90
    # Au-dela, la connaissance entrante est consideree comme un doublon de
    # l'existante : mise a jour de l'entree en place plutot qu'ajout.
    near_duplicate_threshold: 0.95
  lifecycle:
    # Une connaissance non re-confirmee au-dela de cette anciennete est signalee
    # comme potentiellement obsolete. Signalement, jamais suppression automatique.
    stale_after_days: 365

monitoring:
  metrics_dir: metrics
  # Fenetre glissante des rapports de monitoring.
  window_days: 30
  # Referentiel de comparaison du taux de desaccord ML/humain. Null tant qu'aucune
  # mesure de production n'existe : le moniteur refuse alors de conclure a une derive.
  disagreement_baseline: null

# ─────────────────────────────────────────────────────────────────────────────
# AXE 3 — Donnees personnelles (ENF-04 volet b)
# ─────────────────────────────────────────────────────────────────────────────

donnees_personnelles:
  # Pseudonymisation des personnes nommees dans le corpus. La cle vit dans la
  # variable d'environnement PSEUDO_KEY, hors du depot : sans elle un pseudonyme
  # ne se remonte pas, avec elle le service recalcule celui d'un nom connu et
  # retrouve ses tickets, sans conserver de table de correspondance.
  pseudonymiser: true
  variable_de_cle: PSEUDO_KEY
  colonnes_identifiantes: ["Demandeur", "Assigné à"]

  # Durees de conservation. Elles ne sont pas une opinion technique : ce sont des
  # valeurs PROPOSEES au service, qui doit les arreter. Tant que la colonne
  # « arrete_par » reste vide, la purge refuse de supprimer quoi que ce soit.
  conservation:
    arrete_par: ""              # nom et date de la decision du service
    tickets_clos_jours: 1095    # trois ans : duree usuelle d'un historique de support
    journal_audit_jours: 365    # un an : trace des modifications
    comptes_inactifs_jours: 730 # deux ans sans connexion
    jetons_expires_jours: 7     # jetons de reinitialisation deja perimes

# ─────────────────────────────────────────────────────────────────────────────
# Usage du jeu de test gele (remarque de l'encadrant, 2026-10-09)
# ─────────────────────────────────────────────────────────────────────────────

jeu_gele:
  # Un jeu de test ne se degrade pas d'un coup : il se degrade par usage. Chaque
  # lecture qui TRANCHE — promouvoir, rejeter, revenir en arriere — fait passer
  # un peu de son information dans le modele retenu. Au-dela d'un certain nombre
  # de lectures, il ne mesure plus la generalisation : il est devenu un jeu de
  # validation sans que personne ne l'ait decide.
  #
  # Le budget ne verrouille rien : il oblige a rendre la transgression visible.
  # Une fois atteint, promote.py refuse d'arbitrer et renvoie a l'une des deux
  # issues humaines : constituer une nouvelle reference a partir de tickets de
  # production recents, ou assumer la lecture par ecrit avec --force.
  #
  # Valeur retenue : dix. Trois lectures ont deja eu lieu (v2, v3, v4 rejetees),
  # reconstituees au journal depuis le registre. Dix laisse de la marge pour
  # plusieurs cycles de reentrainement sans laisser la derive s'installer.
  lectures_de_decision_max: 10
  journal: data/reference/journal_jeu_gele.json
