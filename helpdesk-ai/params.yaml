data:
  raw_path: data/raw/HelpDesk1.csv
  processed_path: data/processed/HelpDesk1.csv
  train_path: data/splits/train.csv
  test_path: data/splits/test.csv
  rag_path: data/splits/rag.csv
  test_size: 0.2
  random_state: 42

nlp:
  max_features: 5000
  ngram_range: [1, 2]
  min_df: 2

model:
  name: random_forest
  n_estimators: 200
  random_state: 42
  class_weight: balanced

rag:
  top_k: 3
  similarity_threshold: 0.50   # relevé de 0.30 → filtre les suggestions RAG peu pertinentes
  fallback_threshold: 0.20     # seuil fallback (aucun résultat au-dessus de 0.50)
  hybrid_alpha: 0.5             # pondération sémantique dans le score hybride (Semaine 2)

ml:
  confidence_threshold: 0.60   # relevé de 0.40 → routage auto ~70% tickets à ~85% précision
  confidence_threshold_v1: 0.40 # ancienne valeur — conservée pour référence benchmark