data:
  raw_path: data/raw/HelpDesk1.csv
  processed_path: data/processed/HelpDesk1.csv
  train_path: data/splits/train.csv
  test_path: data/splits/test.csv
  rag_path: data/splits/rag.csv
  test_size: 0.2
  random_state: 42

nlp:
  max_features: 5000
  ngram_range: [1, 2]
  min_df: 2

model:
  name: random_forest
  n_estimators: 200
  random_state: 42
  class_weight: balanced

rag:
  top_k: 3
  similarity_threshold: 0.3