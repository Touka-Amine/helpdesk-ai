<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-icon">🎫</span>
      <h1>Helpdesk<span class="logo-ai">AI</span></h1>
    </div>
    <h2>Connexion</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="email">Adresse e-mail</label>
        <input id="email" type="email" formControlName="email"
               placeholder="votre@email.com" autocomplete="email" />
        @if (form.get('email')?.touched && form.get('email')?.invalid) {
          <span class="field-error">Email invalide.</span>
        }
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" formControlName="password"
               placeholder="••••••••" autocomplete="current-password" />
        @if (form.get('password')?.touched && form.get('password')?.invalid) {
          <span class="field-error">Mot de passe requis.</span>
        }
      </div>

      @if (errorMsg()) {
        <div class="alert-error">{{ errorMsg() }}</div>
      }

      <button type="submit" class="btn-primary" [disabled]="loading()">
        @if (loading()) { Connexion… } @else { Se connecter }
      </button>
    </form>

    <p class="footer-link">
      Pas encore de compte ? <a routerLink="/auth/register">Créer un compte</a>
    </p>
  </div>
</div>
