name: tests

# Déclenchement sur les deux événements qui comptent : une poussée sur une branche
# suivie, et toute demande de fusion vers la branche principale.
on:
  push:
    branches: ["main", "chore/**", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: helpdesk-ai/requirements.txt

      - name: Installer les dépendances
        working-directory: helpdesk-ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Le jeu de données, le pipeline entraîné et l'index vectoriel sont suivis par
      # DVC et absents du dépôt Git : le corpus contient des noms de demandeurs en
      # clair. Les dix-huit tests d'intégration de l'API chargent best_pipeline.pkl
      # au démarrage et ne peuvent donc pas s'exécuter sur une copie propre. Les cent
      # quinze autres n'ont besoin d'aucun artefact et couvrent les règles métier, la
      # préparation des textes, les moteurs de recherche, la porte de promotion et le
      # cycle de vie de la base vectorielle.
      - name: Exécuter la suite de tests
        working-directory: helpdesk-ai
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_api_integration.py \
            --cov=src --cov-report=term-missing --cov-report=xml \
            -q

      - name: Conserver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture
          path: helpdesk-ai/coverage.xml
          if-no-files-found: ignore
